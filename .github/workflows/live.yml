name: Live Umbrella validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-umbrella-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate with Umbrella
        env:
          UMBRELLA_DEVICE_ID: 0123456789abcdef
          UMBRELLA_ORGANIZATION_ID: 12345678
        run: go test -tags=live -run '^TestLiveUmbrella$' -count=1 .
